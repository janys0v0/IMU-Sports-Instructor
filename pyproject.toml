# Tool configuration only (the Python code is scripts, not an installable package).

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["third_party"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # line length is left to the formatter
    "E741",  # `l` for "location" is used throughout the experiment code
]

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
