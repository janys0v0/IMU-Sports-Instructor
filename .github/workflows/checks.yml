name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install pre-commit
      # Swift checks need Xcode, so they run locally only; branch rule is local only.
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: swift-format,swift-format-lint,no-commit-to-branch
