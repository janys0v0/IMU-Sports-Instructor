name: checks

on:
  # edited: fixing a PR's title or description re-runs pr-format.
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install pre-commit
      # Swift checks need Xcode, so they run locally only. Branch names are checked in pr-format.
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: swift-format,swift-format-lint,no-commit-to-branch,branch-name-format

  pr-format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Branch, title and body come in through env vars, never inline in the script.
      - name: Branch, title and description follow the project format
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.md"
          python3 tools/check_format.py --pr "$PR_BRANCH" "$PR_TITLE" "$RUNNER_TEMP/pr_body.md"

  swift-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/run_tests.sh --swift-only

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      # Tests that need recordings or the models skip themselves; numpy/scipy cover the rest.
      - run: pip install "numpy==1.23.0" "scipy==1.8.0" pytest
      - run: PYTHON=python tools/run_tests.sh --python-only
