# Checks that run on every commit. Setup once: see CONTRIBUTING.md ("One-time setup").
# Run on everything: pre-commit run --all-files
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
default_language_version:
  python: python3
exclude: ^code/(MobilePoser|IMUCoCo)/

repos:
  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^patches/  # patch context lines must keep their whitespace
      - id: end-of-file-fixer
        exclude: ^patches/
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # Python: lint (with safe autofixes) and format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Swift: format and lint with the swift-format that ships with Xcode
  - repo: local
    hooks:
      - id: swift-format
        name: swift-format (format)
        entry: xcrun swift-format format --in-place --configuration .swift-format
        language: system
        types: [swift]
      - id: swift-format-lint
        name: swift-format (lint)
        entry: xcrun swift-format lint --strict --configuration .swift-format
        language: system
        types: [swift]

  # Data guard: recordings and model files must never be committed
  - repo: local
    hooks:
      - id: no-data-files
        name: no recordings, videos or model files
        entry: Data and model files belong on the shared drive, not in git (see CONTRIBUTING.md)
        language: fail
        files: (^code/recordings/|\.(mp4|mov|npz|npy|pt|pth|ckpt|pkl|zip|h5|jsonl|bin)$)

  # Commit messages: Conventional Commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, test, refactor, perf, build, ci, chore, exp, data]
