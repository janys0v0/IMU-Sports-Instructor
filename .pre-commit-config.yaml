# Checks that run on every commit. Setup once: see CONTRIBUTING.md ("One-time setup").
# Run on everything: pre-commit run --all-files
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
default_language_version:
  python: python3
exclude: ^third_party/(MobilePoser|IMUCoCo)/

repos:
  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^third_party/patches/  # patch context lines must keep their whitespace
      - id: end-of-file-fixer
        exclude: ^third_party/patches/
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # Python: lint (with safe autofixes) and format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Swift: format and lint with the swift-format that ships with Xcode
  - repo: local
    hooks:
      - id: swift-format
        name: swift-format (format)
        entry: xcrun swift-format format --in-place --configuration .swift-format
        language: system
        types: [swift]
      - id: swift-format-lint
        name: swift-format (lint)
        entry: xcrun swift-format lint --strict --configuration .swift-format
        language: system
        types: [swift]

  # Docs: every local link and #heading must exist
  - repo: local
    hooks:
      - id: doc-links
        name: doc links resolve
        entry: python3 tools/check_doc_links.py
        language: system
        types: [markdown]
        pass_filenames: false

  # Data guard: recordings and model files must never be committed
  - repo: local
    hooks:
      - id: no-data-files
        name: no recordings, videos or model files
        entry: Data and model files belong on the shared drive, not in git (see CONTRIBUTING.md)
        language: fail
        files: (^data/|\.(mp4|mov|npz|npy|pt|pth|ckpt|pkl|zip|h5|jsonl|bin)$)

  # Branch names and commit messages: project format (tools/check_format.py, CONTRIBUTING.md)
  - repo: local
    hooks:
      - id: branch-name-format
        name: branch name format
        entry: python3 tools/check_format.py --branch
        language: system
        always_run: true
        pass_filenames: false
      - id: commit-msg-format
        name: commit message format
        entry: python3 tools/check_format.py
        language: system
        stages: [commit-msg]
